  /geojson/de-all.geo.json:
    get:
      summary: Zugriff auf Geojson-Daten zu Deutschland und den Ländern 
      description: Die API ermöglicht Zugriff auf Geojson-Daten zu Deutschland und den Ländern (00-DE_admin1_400).
      operationId: geo
      tags:
        - Geo
      responses:
        '200':
            description: OK
            content:
              application/json:
                schema:
                  type: array
                  items:
