            - data_gemeindesteuern (Kassenmäßige Steuereinnahmen aus Gemeindesteuern)
            - tile_1666960424161 (Baltic Dry Index)
            - tile_1650977632272 (Verschuldung der bedeutendsten Sondervermögen des Bundes)
