components:
  schemas:
    Indicators:
      type: object
      properties:
        id:
          type: string
          example: 'data_adv_flugverkehr'
        date:
          type: integer
          example: 1649772604564
        json:
          type: string
        title:
          type: string
          example:  "Flugverkehr Deutschland"
    Get:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        nameEn:
          type: string
        description:
          type: string
        descriptionEn:
          type: string
        teaser:
          type: string
        teaserEn:
          type: string
        conclusion:
          type: string
        conclusionEn:
          type: string
        category:
          type: object
          properties:
            id:
              type: string
            name:
              type: string
            nameEn:
              type: string
            description:
              type: string
            descriptionEn:
              type: string
            icon:
              type: string
            viewBox:
              type: string
            iconType:
              type: string
            color:
              type: string
            catIndex:
              type: integer
            image:
              type: string
            alt:
              type: string
        tags:
          type: array
          items:
            type: object            
        image:
          type: string
        clicks:
          type: integer
        orderId:
          type: integer
        trending:
          type: boolean
        top:
          type: boolean
        layoutTiles:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
              indicatorId:
                type: string
              orderIndex:
                type: integer
        layoutMode:
          type: string
    Geo:
      type: object
      properties:
        type:
          type: string
        name:
          type: string
        title:
          type: string
        version:
          type: string
        copyrightShort:
          type: string
        copyrightUrl:
          type: string
        crs:
          type: object
          properties:
            type:
              type: string
            properties:
              type: object
              properties:
                name: 
                  type: string
        features:
          type: array
          items:
                  type: object
